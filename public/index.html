<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Address Lookup</title>
<!-- Jotform Custom Widget API -->
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<style>
  /* Defaults. Each one can be overridden by a Jotform widget parameter (see STYLE_PARAMS). */
  :root {
    --focus: #2e69ff;
    --text: #2c3345;
    --muted: #6c7389;
    --border: #c3cad8;
    --bg: #ffffff;
    --hover: #eef3ff;
    --font: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --font-size: 15px;
    --field-height: 40px;
    --radius: 4px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; font-family: var(--font); color: var(--text); }
  .wrap { position: relative; padding: 2px; }
  input {
    width: 100%; height: var(--field-height); padding: 0 12px; font-family: inherit; font-size: var(--font-size); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); outline: none;
  }
  input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 15%, transparent); }
  .search { position: relative; }
  .search[hidden] { display: none; }
  .search svg { position: absolute; left: 12px; top: calc(var(--field-height) / 2 - 8px); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  #addr { padding-left: 36px; }
  .list {
    display: none; margin-top: 4px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg); box-shadow: 0 4px 12px rgba(0,0,0,.08); overflow: hidden;
  }
  .list.open { display: block; }
  .group { padding: 6px 12px 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: color-mix(in srgb, var(--muted) 8%, var(--bg)); }
  .item { padding: 9px 12px; cursor: pointer; font-size: calc(var(--font-size) - 1px); line-height: 1.3; }
  .item .main { font-weight: 500; }
  .item .sub { color: var(--muted); font-size: calc(var(--font-size) - 2px); }
  .item.active, .item:hover { background: var(--hover); }
  .note { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .empty { padding: 9px 12px; font-size: calc(var(--font-size) - 2px); color: var(--muted); }
  .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 12px; border-top: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
  .switch { padding: 0; border: 0; background: none; font: inherit; font-size: 13px; color: var(--focus); text-decoration: underline; cursor: pointer; text-align: left; }
  .powered { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .manual { margin-top: 6px; font-size: 13px; }
  .manual[hidden] { display: none; }
  .manual button { padding: 0; border: 0; background: none; font: inherit; color: var(--focus); text-decoration: underline; cursor: pointer; }
  /* Address parts, laid out like Jotform's built-in Address field */
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 14px; }
  .fields[hidden] { display: none; }
  .field.full { grid-column: 1 / -1; }
  .field label { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) { .fields { grid-template-columns: 1fr; } }
</style>
<style id="custom-css"></style>
</head>
<body>
<div class="wrap">
  <div class="search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="addr" type="text" maxlength="200" autocomplete="off" spellcheck="false"
           placeholder="Search for your address"
           role="combobox" aria-expanded="false" aria-controls="list" aria-autocomplete="list" aria-label="Search for your address">
  </div>
  <div id="list" class="list" role="listbox"></div>
  <div id="note" class="note" hidden></div>
  <div id="manual" class="manual"><button type="button" id="manualBtn">Can't find it? Enter address manually</button></div>
  <div id="fields" class="fields" hidden>
    <div class="field full"><input id="f-street" type="text" maxlength="100" autocomplete="address-line1"><label for="f-street">Street Address</label></div>
    <div class="field full"><input id="f-line2" type="text" maxlength="100" autocomplete="address-line2"><label for="f-line2">Street Address Line 2</label></div>
    <div class="field"><input id="f-city" type="text" maxlength="100" autocomplete="address-level2"><label for="f-city">City</label></div>
    <div class="field"><input id="f-province" type="text" maxlength="100" autocomplete="address-level1"><label for="f-province">Province / State</label></div>
    <div class="field"><input id="f-postal" type="text" maxlength="100" autocomplete="postal-code"><label for="f-postal">Postal / Zip Code</label></div>
    <div class="field"><input id="f-country" type="text" maxlength="100" autocomplete="country-name"><label for="f-country">Country</label></div>
  </div>
</div>

<script>
var DEBOUNCE_MS = 250;

/* =========================================================================
   JOTFORM WIDGET PARAMETERS (all optional; blank keeps the default)
   Sizes accept a plain number (treated as px) or any CSS length.
   ========================================================================= */
var STYLE_PARAMS = {
  accentColor:     "--focus",        // focus outline, links
  textColor:       "--text",         // typed text
  labelColor:      "--muted",        // small labels under fields, hints
  borderColor:     "--border",       // field borders
  fieldBackground: "--bg",           // field and dropdown background
  highlightColor:  "--hover",        // highlighted suggestion
  fontFamily:      "--font",
  fontSize:        "--font-size",
  fieldHeight:     "--field-height",
  cornerRadius:    "--radius"
};
var SIZE_PARAMS = { fontSize: true, fieldHeight: true, cornerRadius: true };
// Values are checked against this CSS property; anything invalid keeps the default.
var PARAM_CHECK = { fontFamily: "font-family", fontSize: "width", fieldHeight: "width", cornerRadius: "width" };
// Text parameters: searchPlaceholder, manualLinkText, labelStreet, labelLine2,
// labelCity, labelProvince, labelPostal, labelCountry. Plus customCSS.
// searchCountry: two-letter country code searched by default (e.g. ca, us, gb);
// blank uses the server's PRIMARY_COUNTRY. People can switch to all countries.

var input     = document.getElementById("addr");
var list      = document.getElementById("list");
var note      = document.getElementById("note");
var searchBox = document.querySelector(".search");
var manualBox = document.getElementById("manual");
var manualBtn = document.getElementById("manualBtn");
var fieldsBox = document.getElementById("fields");

// The labels are also the line names in the submitted value, e.g. "City: Guelph".
var FIELDS = [
  { key: "street",   id: "f-street",   param: "labelStreet",   label: "Street Address" },
  { key: "line2",    id: "f-line2",    param: "labelLine2",    label: "Street Address Line 2" },
  { key: "city",     id: "f-city",     param: "labelCity",     label: "City" },
  { key: "province", id: "f-province", param: "labelProvince", label: "Province / State", oldLabels: ["State / Province"] },
  { key: "postal",   id: "f-postal",   param: "labelPostal",   label: "Postal / Zip Code" },
  { key: "country",  id: "f-country",  param: "labelCountry",  label: "Country" }
];
var field = {};
FIELDS.forEach(function (f) { f.el = document.getElementById(f.id); field[f.key] = f.el; });

// Characters allowed in the search bar and the address fields: letters in any
// language (with accents), digits, spaces and . , ' ’ # / & ( ) -. Anything
// else is removed as it's typed or pasted. The server checks searches the same way.
var NOT_ALLOWED = /[^\p{L}\p{M}\p{N} .,'’#\/&()-]/gu;
var LIMIT_MESSAGE = "Address search has reached its limit for now. Please enter your address below.";

var sessionToken = newSessionToken();
var customPlaceholder = false;   // set when the searchPlaceholder parameter is used
var searchCountry = "";          // from the searchCountry parameter; "" = server default
var searchScope = "country";     // "country" (default) or "world" after the person asks for it
var currentItems = [];
var activeIndex = -1;
var requestSeq = 0;
var debounceTimer = null;
var inJotform = window.parent !== window && typeof JFCustomWidget !== "undefined";

/* ---------- Allowed characters ---------- */
function cleanText(value) {
  return String(value == null ? "" : value).replace(/\s/g, " ").replace(NOT_ALLOWED, "");
}

// Clean an input in place, keeping the cursor where the person was typing
function cleanInput(el) {
  var before = el.value, after = cleanText(before);
  if (after === before) return;
  var caret = el.selectionStart == null ? before.length : el.selectionStart;
  var pos = cleanText(before.slice(0, caret)).length;   // only removals before the cursor move it
  el.value = after;
  try { el.setSelectionRange(pos, pos); } catch (e) {}
}

// A saved value never starts with "-", so spreadsheets can't read it as a formula
function fieldValue(f) {
  return f.el.value.trim().replace(/^-+\s*/, "");
}

/* ---------- Jotform plumbing ---------- */
function currentValue() {
  return FIELDS
    .filter(function (f) { return fieldValue(f); })
    .map(function (f) { return f.label + ": " + fieldValue(f); })
    .join("\n");
}

// Empty is fine (Jotform's own "required" setting handles that); a partly
// filled address needs at least street, city and country.
function isValid() {
  if (!currentValue()) return true;
  return !!(fieldValue(FIELDS[0]) && fieldValue(FIELDS[2]) && fieldValue(FIELDS[5]));
}

function pushToForm() {
  if (!inJotform) return;
  JFCustomWidget.sendData({ value: currentValue() });
}

function resizeFrame() {
  if (!inJotform) return;
  var h = Math.ceil(document.querySelector(".wrap").getBoundingClientRect().height) + 6;
  JFCustomWidget.requestFrameResize({ height: h });
}

function applySettings(settings) {
  // Jotform shows unset parameters as "undefined" and may pass that text on
  function get(name) {
    var v = settings[name];
    v = v == null ? "" : String(v).trim();
    return /^(undefined|null)$/i.test(v) ? "" : v;
  }
  var root = document.documentElement.style;
  Object.keys(STYLE_PARAMS).forEach(function (name) {
    var v = get(name);
    if (!v) return;
    if (SIZE_PARAMS[name] && /^\d+(\.\d+)?$/.test(v)) v += "px";
    if (window.CSS && CSS.supports && !CSS.supports(PARAM_CHECK[name] || "color", v)) return;
    root.setProperty(STYLE_PARAMS[name], v);
  });

  var placeholder = get("searchPlaceholder");
  if (placeholder) {
    customPlaceholder = true;
    input.placeholder = placeholder;
    input.setAttribute("aria-label", placeholder);
  }
  if (get("manualLinkText")) manualBtn.textContent = get("manualLinkText");
  FIELDS.forEach(function (f) {
    var label = get(f.param);
    if (!label) return;
    f.label = label;
    document.querySelector('label[for="' + f.id + '"]').textContent = label;
  });
  document.getElementById("custom-css").textContent = get("customCSS");
  var country = get("searchCountry").toLowerCase();
  if (/^[a-z]{2}$/.test(country)) searchCountry = country;
}

// Refill the fields from a saved value (e.g. editing a submission)
function restore(value) {
  var any = false;
  String(value).split("\n").forEach(function (line) {
    var i = line.indexOf(": ");
    if (i < 0) return;
    var label = line.slice(0, i), v = line.slice(i + 2);
    FIELDS.forEach(function (f) {
      // oldLabels: names used by earlier versions, so older submissions still load
      if (f.label === label || (f.oldLabels || []).indexOf(label) !== -1) { f.el.value = cleanText(v); any = true; }
    });
  });
  if (any) showFields(true);
}

function setupJotform() {
  if (!inJotform) return;
  JFCustomWidget.subscribe("ready", function (formData) {
    var settings = {};
    try { settings = JFCustomWidget.getWidgetSettings() || {}; } catch (e) {}
    applySettings(settings);
    if (formData && formData.value) restore(formData.value);
    JFCustomWidget.subscribe("submit", function () {
      JFCustomWidget.sendSubmit({ valid: isValid(), value: currentValue() });
    });
    resizeFrame();
  });
}

/* ---------- Address lookups (done by this site's server, which holds the Google key) ---------- */
function newSessionToken() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, function (c) {
    return (c ^ (Math.random() * 16) >> (c / 4)).toString(16);
  });
}

function api(path, params) {
  var qs = Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); })
    .concat("session=" + encodeURIComponent(sessionToken)).join("&");
  return fetch("/api/" + path + "?" + qs).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (body) {
      if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
      return body;
    });
  });
}

// not_configured: the server has no Google key, so searching can't work at all.
// quota_exceeded / rate_limited: the lookup limit is reached; switch to manual entry.
// Anything else (Google outage, network): keep the search bar for a retry, but
// say so and open the fields so the form can still be filled.
function handleLookupError(err) {
  if (window.console) console.warn("Address lookup failed:", err.message);
  if (err.message === "not_configured") {
    searchUnavailable("Address search is unavailable right now. Please type your address below.");
    return;
  }
  if (err.message === "quota_exceeded" || err.message === "rate_limited") {
    searchUnavailable(LIMIT_MESSAGE);
    return;
  }
  note.hidden = false;
  note.textContent = "Address search isn't available right now. Please enter your address below.";
  showFields(true);
}

// res: { countryName, scope, groups: [{ label, items }] } from /api/suggest
function render(res) {
  list.innerHTML = "";
  currentItems = [];
  activeIndex = -1;

  res.groups.forEach(function (group) {
    if (!group.items.length) return;
    var g = document.createElement("div");
    g.className = "group"; g.textContent = group.label;
    list.appendChild(g);
    group.items.forEach(function (s) {
      var idx = currentItems.length;
      var el = document.createElement("div");
      el.className = "item"; el.setAttribute("role", "option"); el.id = "opt-" + idx;
      var main = document.createElement("div"); main.className = "main"; main.textContent = s.main;
      var sub = document.createElement("div"); sub.className = "sub"; sub.textContent = s.secondary;
      el.appendChild(main); el.appendChild(sub);
      el.addEventListener("mousedown", function (e) { e.preventDefault(); choose(idx); });
      list.appendChild(el);
      currentItems.push({ suggestion: s, el: el });
    });
  });

  var inCountry = res.scope !== "world";
  if (!currentItems.length) {
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = inCountry ? "No matches in " + res.countryName + "." : "No matches found.";
    list.appendChild(empty);
  }

  // Footer: switch between the default country and all countries, plus Google's note
  var footer = document.createElement("div");
  footer.className = "footer";
  var sw = document.createElement("button");
  sw.type = "button"; sw.className = "switch";
  sw.textContent = inCountry ? "Not in " + res.countryName + "? Search all countries" : "Search " + res.countryName + " only";
  sw.addEventListener("mousedown", function (e) { e.preventDefault(); });   // keep focus in the search bar
  sw.addEventListener("click", function () { setScope(inCountry ? "world" : "country"); });
  footer.appendChild(sw);
  if (currentItems.length) {
    var pw = document.createElement("span");
    pw.className = "powered"; pw.textContent = "Powered by Google";
    footer.appendChild(pw);
  }
  list.appendChild(footer);
  openList(true);
}

function openList(open) {
  list.classList.toggle("open", open);
  input.setAttribute("aria-expanded", open ? "true" : "false");
  resizeFrame();
}

function highlight(i) {
  currentItems.forEach(function (it, j) { it.el.classList.toggle("active", j === i); });
  activeIndex = i;
  if (i >= 0) input.setAttribute("aria-activedescendant", "opt-" + i);
  else input.removeAttribute("aria-activedescendant");
}

function showFields(show) {
  fieldsBox.hidden = !show;
  manualBox.hidden = show;
  resizeFrame();
}

/* ---------- Picking an address ---------- */
function choose(i) {
  var item = currentItems[i];
  if (!item) return;
  openList(false);
  input.value = item.suggestion.text;

  api("place", { id: item.suggestion.id }).then(function (parts) {
    fillFields(parts);
    input.value = "";
    if (!customPlaceholder) input.placeholder = "Search for a different address";
  }).catch(function (err) {
    // Details unavailable: let the person type the parts themselves
    handleLookupError(err);
    showFields(true);
    field.street.focus();
  }).finally(function () {
    sessionToken = newSessionToken();   // a session ends when a place is selected
  });
}

function fillFields(p) {
  var unit = cleanText(p.unit);
  field.street.value   = cleanText([p.streetNumber, p.route].filter(Boolean).join(" "));
  field.line2.value    = /^\d+[A-Za-z]?$/.test(unit) ? "Unit " + unit : unit;
  field.city.value     = cleanText(p.city);
  field.province.value = cleanText(p.province);
  field.postal.value   = cleanText(p.postalCode);
  field.country.value  = cleanText(p.country);
  showFields(true);
  pushToForm();
  // A street without a house number (or nothing at all) needs finishing by hand
  if (!p.streetNumber) field.street.focus();
}

/* ---------- Input events ---------- */
function search(text) {
  var mySeq = ++requestSeq;
  var params = { q: text, scope: searchScope };
  if (searchCountry) params.country = searchCountry;
  api("suggest", params).then(function (res) {
    if (mySeq !== requestSeq) return;   // ignore stale responses
    note.hidden = true;                 // search works (again)
    render(res);
  }).catch(function (err) {
    if (mySeq === requestSeq) openList(false);
    handleLookupError(err);
  });
}

// Switching keeps the person's choice for the rest of the visit and re-runs the search
function setScope(scope) {
  searchScope = scope;
  clearTimeout(debounceTimer);
  var text = input.value.trim();
  if (text.length >= 3) search(text);
  input.focus();
}

input.addEventListener("input", function () {
  cleanInput(input);
  clearTimeout(debounceTimer);
  var text = input.value.trim();
  if (text.length < 3) { openList(false); return; }
  debounceTimer = setTimeout(function () { search(text); }, DEBOUNCE_MS);
});

input.addEventListener("keydown", function (e) {
  if (!list.classList.contains("open")) return;
  if (e.key === "ArrowDown") { e.preventDefault(); highlight(Math.min(activeIndex + 1, currentItems.length - 1)); }
  else if (e.key === "ArrowUp") { e.preventDefault(); highlight(Math.max(activeIndex - 1, 0)); }
  else if (e.key === "Enter") { if (activeIndex >= 0) { e.preventDefault(); choose(activeIndex); } }
  else if (e.key === "Escape") { openList(false); }
});

input.addEventListener("blur", function () { setTimeout(function () { openList(false); }, 150); });

FIELDS.forEach(function (f) {
  f.el.addEventListener("input", function () { cleanInput(f.el); pushToForm(); });
});

manualBtn.addEventListener("click", function () {
  showFields(true);
  field.street.focus();
});

function searchUnavailable(message) {
  searchBox.hidden = true;
  openList(false);
  note.hidden = false;
  note.textContent = message;
  showFields(true);
}

/* ---------- Start ---------- */
// Keep the form's frame as tall as the widget (rotation, wrapping labels, fonts loading)
if (window.ResizeObserver) new ResizeObserver(resizeFrame).observe(document.querySelector(".wrap"));
setupJotform();
// If the lookup limit is already reached, offer manual entry straight away
// (this check doesn't use any Google quota). Other errors wait until someone searches.
api("status", {}).then(function (res) {
  if (res.search === "limited") searchUnavailable(LIMIT_MESSAGE);
}).catch(function (err) {
  if (/^(not_configured|quota_exceeded|rate_limited)$/.test(err.message)) handleLookupError(err);
});
</script>
</body>
</html>
